name: Rule review dates
on:
  push:
  schedule:
    - cron: "0 3 * * 1"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -I scripts/check-rule-dates.py --max-age 120
